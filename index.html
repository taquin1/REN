<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f43f5e" />
    <meta name="description" content="לב חם - אתר היכרויות חינמי לחלוטין. מצא את האהבה הבאה שלך היום." />
    <title>לב חם | היכרויות חינמיות</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; font-family: 'Heebo', system-ui, sans-serif; }
      body { background-color: #fff7ed; }
      #root { min-height: 100%; }
      .loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #f43f5e, #fb923c); color: white; z-index: 9999;
      }
      .loader-content { text-align: center; }
      .loader-heart {
        width: 80px; height: 80px; margin: 0 auto 20px;
        background: rgba(255,255,255,0.2); border-radius: 24px;
        display: flex; align-items: center; justify-content: center;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .loader-heart svg { width: 40px; height: 40px; fill: white; }
      .loader-text { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
      .loader-sub { font-size: 14px; opacity: 0.8; margin-top: 8px; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loader">
        <div class="loader-content">
          <div class="loader-heart">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
          <div class="loader-text">לב חם</div>
          <div class="loader-sub">טוען את האהבה...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
