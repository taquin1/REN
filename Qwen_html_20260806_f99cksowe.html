<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שידוכים - הכרויות לדתיים | בחינם</title>
    <!-- טעינת Tailwind CSS לעיצוב מהיר -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- אייקונים -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- גופן עברי נעים -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Heebo', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* הסתרת אלמנטים */
        .hidden-section { display: none; }
    </style>
</head>
<body class="text-gray-800">

    <!-- ==================== דף התחברות ==================== -->
    <div id="login-page" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-indigo-100">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center fade-in">
            <div class="mb-6">
                <i class="fa-solid fa-heart text-blue-600 text-5xl mb-4"></i>
                <h1 class="text-3xl font-bold text-gray-900">שידוכים</h1>
                <p class="text-gray-500 mt-2">הכרויות רציניות למגזר הדתי והחרדי</p>
            </div>

            <div class="space-y-4">
                <!-- כפתור גוגל -->
                <button onclick="socialLogin('Google')" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-sm">
                    <i class="fa-brands fa-google text-red-500 text-xl"></i>
                    <span>המשך עם Google</span>
                </button>

                <!-- כפתור פייסבוק -->
                <button onclick="socialLogin('Facebook')" class="w-full flex items-center justify-center gap-3 bg-[#1877F2] hover:bg-[#166fe5] text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-sm">
                    <i class="fa-brands fa-facebook text-xl"></i>
                    <span>המשך עם Facebook</span>
                </button>
            </div>

            <div class="mt-8 text-xs text-gray-400">
                הכניסה לאתר היא בחינם לחלוטין.<br>
                אנו שומרים על צנעת הפרט ואבטחת המידע.
            </div>
        </div>
    </div>

    <!-- ==================== האפליקציה הראשית ==================== -->
    <div id="app-main" class="hidden-section min-h-screen flex flex-col">
        
        <!-- תפריט עליון -->
        <nav class="bg-white shadow-sm sticky top-0 z-50">
            <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-heart text-blue-600 text-xl"></i>
                    <span class="font-bold text-lg">שידוכים</span>
                </div>
                <button onclick="logout()" class="text-gray-500 hover:text-red-500 transition">
                    <i class="fa-solid fa-right-from-bracket text-xl"></i>
                </button>
            </div>
        </nav>

        <!-- אזור הפרופילים -->
        <main class="flex-grow p-4 max-w-4xl mx-auto w-full">
            
            <!-- ברכה -->
            <div class="mb-6 text-center">
                <h2 class="text-2xl font-bold text-gray-800">שלום, <span id="user-name">אורח</span></h2>
                <p class="text-gray-500">הפרופילים המומלצים עבורך להיום</p>
            </div>

            <!-- רשת כרטיסים -->
            <div id="profiles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- הפרופילים יטענו כאן דינמית -->
            </div>

        </main>
    </div>

    <!-- ==================== מודאל "התאמה" ==================== -->
    <div id="match-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl text-center max-w-sm w-full mx-4 animate-bounce-short">
            <i class="fa-solid fa-star text-yellow-400 text-4xl mb-3"></i>
            <h3 class="text-xl font-bold mb-2">יש התאמה!</h3>
            <p class="text-gray-600 mb-4">שלחנו הודעה לשניכם. בהצלחה!</p>
            <button onclick="closeModal()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">מעולה</button>
        </div>
    </div>

    <script>
        // --- נתונים מדומים (Mock Data) ---
        const mockProfiles = [
            { name: "שרה", age: 24, city: "ירושלים", type: "דתי לאומי", img: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=400&q=80", desc: "מחפשת מישהו רציני, לומדת חינוך." },
            { name: "יוסי", age: 26, city: "בני ברק", type: "חרדי", img: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=400&q=80", desc: "למדן, שקדן, מחפש בת מידות טובות." },
            { name: "רחל", age: 23, city: "מודיעין", type: "דתי", img: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=400&q=80", desc: "אוהבת טבע, מוזיקה וטיולים." },
            { name: "דוד", age: 28, city: "תל אביב", type: "מסורתי-דתי", img: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80", desc: "עובד בהייטק, שומר שבת וכשרות." },
            { name: "חנה", age: 25, city: "חיפה", type: "דתי לאומי", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80", desc: "סטודנטית לפסיכולוגיה, ביתית וחמה." },
            { name: "משה", age: 27, city: "פתח תקווה", type: "דתי", img: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=400&q=80", desc: "נגן כינור, מחפש קשר מבוסס חברות." }
        ];

        // --- פונקציות ניהול מצב ---

        function socialLogin(provider) {
            // כאן בעתיד יתבצע החיבור האמיתי ל-API
            console.log(`Logging in with ${provider}...`);
            
            // סימולציית המתנה קצרה
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> מתחבר...`;
            
            setTimeout(() => {
                document.getElementById('login-page').classList.add('hidden-section');
                document.getElementById('app-main').classList.remove('hidden-section');
                document.getElementById('user-name').innerText = provider === 'Google' ? 'משתמש גוגל' : 'משתמש פייסבוק';
                renderProfiles();
            }, 1000);
        }

        function logout() {
            document.getElementById('app-main').classList.add('hidden-section');
            document.getElementById('login-page').classList.remove('hidden-section');
            // איפוס כפתורים
            location.reload(); 
        }

        function renderProfiles() {
            const grid = document.getElementById('profiles-grid');
            grid.innerHTML = ''; // ניקוי

            mockProfiles.forEach(profile => {
                const card = `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition duration-300 fade-in">
                        <div class="h-48 bg-gray-200 relative">
                            <img src="${profile.img}" alt="${profile.name}" class="w-full h-full object-cover">
                            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black to-transparent p-4">
                                <h3 class="text-white text-xl font-bold">${profile.name}, ${profile.age}</h3>
                            </div>
                        </div>
                        <div class="p-4">
                            <div class="flex items-center gap-2 text-sm text-gray-500 mb-2">
                                <i class="fa-solid fa-location-dot"></i> ${profile.city}
                                <span class="mx-1">•</span>
                                <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full text-xs">${profile.type}</span>
                            </div>
                            <p class="text-gray-600 text-sm mb-4 line-clamp-2">${profile.desc}</p>
                            
                            <div class="flex gap-2">
                                <button onclick="showMatch()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium">
                                    <i class="fa-solid fa-heart ml-1"></i> מעוניין/ת
                                </button>
                                <button class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                                    <i class="fa-solid fa-xmark text-gray-400"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function showMatch() {
            const modal = document.getElementById('match-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('match-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
</html>
